name: Verify

# Verification only — this workflow never deploys. Adding a release step is a
# separate, deliberate decision.
on:
  push:
  pull_request:

# A second push to the same branch makes the first run irrelevant; cancel it
# rather than paying for an answer about superseded code.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # package.json declares `engines.node: >=20.9.0`. CI pins that floor
      # rather than the newest LTS: development happens on a current Node, so
      # testing the minimum here is what actually keeps the claim honest.
      - uses: actions/setup-node@v4
        with:
          node-version: 20.9.0
          cache: npm

      # `npm ci` rather than `npm install` — it installs exactly what the
      # lockfile pins and fails if the lockfile and package.json disagree.
      - run: npm ci

      # lint → typecheck → test → build, the same chain used locally.
      - run: npm run verify
