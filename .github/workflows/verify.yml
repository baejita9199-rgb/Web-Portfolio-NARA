name: Verify

# Verification only — this workflow never deploys. Adding a release step is a
# separate, deliberate decision.
on:
  push:
  pull_request:

# A second push to the same branch makes the first run irrelevant; cancel it
# rather than paying for an answer about superseded code.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Pinned to the floor of the supported range in package.json, so CI is
      # what keeps that claim honest — development happens on a current Node.
      #
      # The floor is set by rolldown, vite and @vitejs/plugin-react, which all
      # require `^20.19.0 || >=22.12.0`. An earlier pin of 20.9.0 (the old,
      # wrong `engines` value) failed here: Node 20.9 has no `util.styleText`,
      # so Vitest could not start at all. 22.12.0 is chosen over 20.19.0
      # because the Node 20 line reached end of life in April 2026.
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      # `npm ci` rather than `npm install` — it installs exactly what the
      # lockfile pins and fails if the lockfile and package.json disagree.
      - run: npm ci

      # lint → typecheck → test → build, the same chain used locally.
      - run: npm run verify
